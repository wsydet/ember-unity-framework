name: Shared binary integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            scripts
            Packages/com.ember/SharedAssets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-shared-binaries.py --revision HEAD --checkout
      - run: python scripts/check-shared-font-config.py --revision HEAD
