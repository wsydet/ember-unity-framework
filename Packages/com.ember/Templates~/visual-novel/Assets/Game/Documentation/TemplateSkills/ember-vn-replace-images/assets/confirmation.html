<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片替换确认</title>
<style>
body{font:16px system-ui;background:#f3f5f8;color:#203044;margin:32px auto;max-width:1180px;padding:0 20px}h1{margin-bottom:8px}article{background:white;border-radius:14px;padding:24px;margin:20px 0;box-shadow:0 3px 16px #20304410}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}img{width:100%;height:300px;object-fit:contain;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/20px 20px}select,button{font:inherit;padding:10px;border:1px solid #bcc8d5;border-radius:6px}select{width:100%}button{cursor:pointer;background:#fff;margin:6px}button.primary{background:#245bca;color:white}button:disabled{opacity:.45;cursor:default}.warning{color:#9b5200;white-space:pre-wrap}.path{overflow-wrap:anywhere;font-size:13px;color:#567}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e8edf5;padding:20px}footer{position:sticky;bottom:0;padding:12px;background:#f3f5f8ee}#status{white-space:pre-wrap}label{display:block;margin-top:12px}@media(max-width:700px){.pair{grid-template-columns:1fr}body{margin:16px auto}}
</style>
<h1>图片替换确认</h1><p>逐图选择对应旧资源。请特别核对表情、服装、姿态和昼夜差分；默认跳过，确认后由代理执行替换。</p>
<p id="mode"></p><main id="items"></main><h2>最终替换计划</h2><pre id="plan">尚未预览</pre>
<footer><button id="save">保存草稿</button><button id="preview">预览计划</button><button id="confirm" class="primary" disabled>确认替换</button><button id="cancel">取消本批</button><p id="status" role="status"></p></footer>
<script>
let manifest,choices,reviewHash=null;
const byId=id=>document.getElementById(id);
const text=(tag,value,parent,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e};
function invalidate(){reviewHash=null;byId('confirm').disabled=true;byId('plan').textContent='选择已改变，请重新预览';}
async function api(action,data){const r=await fetch(action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
function lock(){document.querySelectorAll('button,select,input').forEach(e=>e.disabled=true);}
function render(){
 byId('items').replaceChildren();
 manifest.items.forEach((item,i)=>{
  const card=document.createElement('article');byId('items').append(card);text('h2',`图片 ${i+1}`,card);
  const pair=document.createElement('div');pair.className='pair';card.append(pair);
  const left=document.createElement('div'),right=document.createElement('div');pair.append(left,right);
  text('h3','新图片',left);const img=document.createElement('img');img.src=`image/${i}`;img.alt='新图片';left.append(img);text('p',item.source,left,'path');text('p',JSON.stringify(item.info.size)+' · '+item.info.format,left);
  text('h3','项目中的旧图片',right);const select=document.createElement('select');select.setAttribute('aria-label',`图片 ${i+1} 的替换目标`);right.append(select);
  const skip=document.createElement('option');skip.value='';skip.textContent='跳过 / 未找到对应资源';select.append(skip);
  item.candidates.forEach((c,j)=>{const o=document.createElement('option');o.value=j;o.textContent=c.target+(c.blocked?' [阻断]':'');select.append(o)});
  select.value=choices[i].candidate===null?'':String(choices[i].candidate);
  const details=document.createElement('div');right.append(details);
  function show(){details.replaceChildren();const c=item.candidates[choices[i].candidate];if(!c){text('p','本图不会修改任何旧资源',details);return;}
   const old=document.createElement('img');old.src=`image/${i}/${choices[i].candidate}`;old.alt='候选旧图片';details.append(old);
   text('p',c.target,details,'path');text('p',c.reason,details);text('p','引用影响：'+(c.references.join('；')||'分析未列出引用，请核对检索范围'),details);
   if(c.blocked)text('p','无法替换：'+c.blocked,details,'warning');
   if(c.warnings.length){text('p',c.warnings.join('\n'),details,'warning');const label=document.createElement('label'),ack=document.createElement('input');ack.type='checkbox';ack.checked=choices[i].acknowledged;label.append(ack,document.createTextNode(' 已核对差分和全部引用影响'));details.append(label);ack.onchange=()=>{choices[i].acknowledged=ack.checked;invalidate()};}
  }
  select.onchange=()=>{choices[i]={candidate:select.value===''?null:Number(select.value),acknowledged:false};invalidate();show()};show();
 });
}
async function run(action){try{const result=await api(action,{choices,reviewHash});if(action==='preview'){reviewHash=result.reviewHash;byId('plan').textContent=JSON.stringify(result.plan,null,2);byId('confirm').disabled=!manifest.ready;}byId('status').textContent=action==='preview'?'请核对计划后确认':result.status==='confirmed'?'已确认，尚未替换图片。请返回聊天继续执行。':result.status==='cancelled'?'已取消，本批不会执行替换。':'草稿已保存';if(['confirm','cancel'].includes(action))lock();}catch(e){invalidate();byId('status').textContent=e.message;}}
for(const [id,action] of [['save','draft'],['preview','preview'],['confirm','confirm'],['cancel','cancel']])byId(id).onclick=()=>run(action);
fetch('manifest').then(r=>r.json()).then(data=>{manifest=data;choices=data.draft||data.items.map(()=>({candidate:null,acknowledged:false}));byId('mode').textContent=data.ready?'已完成 Unity 前置检查；提交不自动改写图片。':'草稿模式：未完成 Unity MCP 检查，不能确认替换。';render();if(data.state!=='pending'){byId('status').textContent='本批状态：'+data.state;lock();}}).catch(e=>{byId('status').textContent=e.message;lock()});
</script></html>
